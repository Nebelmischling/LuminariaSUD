<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Luminaria</title>
<style>
  :root{--bg:#0b0d12;--panel:#141824;--ink:#e7e2d0;--dim:#9a917c;--accent:#c9a24b;--room:#1b2233;--border:#2a3040}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Iowan Old Style",Georgia,serif}
  .wrap{display:grid;grid-template-columns:360px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
        gap:12px;padding:12px;max-width:1200px;margin:0 auto;height:100vh}
  header{grid-area:1/1/2/3;display:flex;align-items:baseline;gap:12px}
  header h1{font-size:20px;margin:0;color:var(--accent);letter-spacing:.06em}
  header .sub{color:var(--dim);font-size:13px}
  #busydot{display:none;width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center;
           animation:pulse 1s ease-in-out infinite}
  body.busy #busydot{display:inline-block}
  @keyframes pulse{50%{opacity:.25}}
  #left{grid-area:2/1/3/2;display:flex;flex-direction:column;gap:12px;min-height:0}
  #room{flex:1;min-height:0}
  #hud{flex:none;max-height:34%}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto}
  #room{background:var(--room)}
  #roomimage{display:block;width:100%;height:auto;max-height:240px;object-fit:contain;border-radius:6px;margin:0 0 10px}
  #roomimage[hidden]{display:none}
  #room h2,#hud h2{margin:0 0 6px;font-size:14px;color:var(--accent);letter-spacing:.05em}
  #log{grid-area:2/2/3/3;min-height:0}
  .line{margin:2px 0;white-space:pre-wrap}
  .say{color:var(--ink)} .warn{color:#d9b45b} .bad{color:#e07a6a}
  .narration{color:#cdb9f5;font-style:italic;border-left:3px solid #7a5cc7;padding-left:10px;margin:8px 0;background:rgba(122,92,199,.07)}
  .panel-room,.panel-hud{color:#6f7891;font-size:12.5px;border-left:2px solid var(--border);padding-left:8px;margin:6px 0;opacity:.85}
  .hud-text{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--dim)}
  /* --- 2b: structured HUD --- */
  .bars{display:flex;flex-direction:column;gap:6px}
  .barrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .barrow label{width:64px;color:var(--dim);flex:none}
  .bar{flex:1;height:10px;background:#0f131c;border:1px solid var(--border);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%}
  .bar.hp i{background:#7fbf6a} .bar.sat i{background:#c9a24b} .bar.ins i{background:#8a6fd1}
  .barrow b{width:56px;text-align:right;font-weight:600;flex:none}
  .statline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--dim)}
  .statline span{background:#10141d;border:1px solid var(--border);border-radius:6px;padding:2px 7px}
  .statline span b{color:var(--ink);font-weight:600}
  .equipped{margin-top:10px;font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
  .equipped i{color:#d9b45b;font-style:normal}
  .effects{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .effect{font-size:11.5px;background:#241f10;border:1px solid #5a4a2a;color:#d9b45b;border-radius:6px;padding:1px 7px}
  .questline{margin-top:10px;font-size:12.5px;border-top:1px solid var(--border);padding-top:8px}
  .questline small{display:block;color:var(--dim);margin-top:2px}
  /* --- 2b: inventory panel --- */
  #inv{flex:none;max-height:32%}
  .invhead{font-size:11.5px;color:var(--dim);margin-bottom:6px}
  .invrow{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed #232a3c;font-size:13px}
  .invrow:last-child{border-bottom:0}
  .invrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .invrow .qty{color:var(--dim);flex:none}
  .invrow .worn{font-size:10px;color:#8fb8d9;border:1px solid #2e4358;border-radius:4px;padding:0 4px;flex:none}
  .iact{background:#20283a;border:1px solid var(--border);border-radius:5px;color:#bcd6a0;font-size:10.5px;padding:2px 6px;cursor:pointer;flex:none}
  .iact:hover{border-color:var(--accent)}
  body.busy .iact{opacity:.45;pointer-events:none}
  .invempty{color:var(--dim);font-size:12.5px}
  /* --- compass exits --- */
  .compass{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .compass .ghost,.compass .rose{height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .compass .ghost{color:#39415a;font-size:12px;background:#10141d;border:1px dashed #232a3c}
  .compass .rose{color:#4a5474;font-size:15px}
  .exit{height:46px;border-radius:8px;border:1px solid #35452c;background:#232c1f;color:#bcd6a0;
        font:600 15px/1.2 inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .exit small{font-weight:400;font-size:10.5px;opacity:.75}
  .exit:hover{border-color:var(--accent)}
  .exit.door{border-color:#5a4a2a;background:#241f10;color:#d9b45b}
  .exit.obstacle{border-color:#5a3a3a;background:#241214;color:#e07a6a}
  .exit.stairs{border-color:#2e4358;background:#12202b;color:#8fb8d9}
  body.busy .exit{opacity:.45;pointer-events:none}
  .hotspots{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .hot{background:#232c1f;border:1px solid #35452c;border-radius:6px;padding:2px 8px;font-size:12px;color:#bcd6a0}
  #promptbar{grid-area:3/1/4/3;display:none;gap:8px;align-items:center}
  #promptbar label{color:var(--accent);white-space:pre-wrap}
  #promptbar input{flex:1;background:#0f131c;border:1px solid var(--accent);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit}
  .controls{grid-area:4/1/5/3;display:flex;gap:8px}
  input#cmd{flex:1;background:#0f131c;border:1px solid var(--border);border-radius:8px;color:var(--ink);padding:10px 12px;font:inherit}
  button{background:var(--accent);color:#1a1408;border:0;border-radius:8px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) auto auto;height:auto;min-height:100vh}
    #left{grid-area:auto;flex-direction:column}
    #room{max-height:42vh;flex:none}
    #hud{max-height:20vh}
    #log{grid-area:auto;min-height:45vh}
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>LUMINARIA</h1><span class="sub">the city that forgets itself</span><span id="busydot" title="the game is working"></span></header>
  <div id="left">
    <div id="room" class="panel"><h2>Room</h2><img id="roomimage" alt="" hidden><div id="roombody"></div></div>
    <div id="inv" class="panel"><h2>Inventory</h2><div id="invbody"></div></div>
    <div id="hud" class="panel"><h2>Character</h2><div id="hudbody"></div></div>
  </div>
  <div id="log" class="panel"></div>
  <div id="promptbar"><label id="promptlabel">prompt</label><input id="ans" autocomplete="off"><button id="ansbtn">answer</button></div>
  <div class="controls"><input id="cmd" autocomplete="off" placeholder="type a command (look, talk, inv, improvise ...) — ↑ for history"><button id="send">Go</button></div>
</div>
<script>
let cursor = 0, polling = null, busy = false;
let hist = [], hidx = 0;
const $ = s => document.querySelector(s);
const DIR_CMD = {North:'n', South:'s', East:'e', West:'w', Up:'u', Down:'d'};
// compass cells in grid order: corner, N, U / W, rose, E / corner, S, D
const COMPASS = [null,'North','Up','West','rose','East',null,'South','Down'];
const roomImageVisits = new Set();
// Keep only a few binary images; object URLs belong solely to the displayed room.
const roomImageCache = new Map();
let roomImageSession = null, roomImageKey = null, roomImageRequest = null, roomImageURL = null, roomImageTimeout = null;

function clearRoomImage(){
  if(roomImageRequest){ roomImageRequest.abort(); roomImageRequest = null; }
  clearTimeout(roomImageTimeout); roomImageTimeout = null;
  const img = $('#roomimage');
  img.onload = img.onerror = null;
  img.hidden = true;
  img.removeAttribute('src');
  if(roomImageURL){ URL.revokeObjectURL(roomImageURL); roomImageURL = null; }
}
function showRoomImage(blob, room){
  const img = $('#roomimage');
  img.alt = 'Illustration of '+(room.name||'this room');
  roomImageURL = URL.createObjectURL(blob);
  const url = roomImageURL, key = roomImageKey;
  img.onload = ()=>{ if(roomImageURL===url) img.hidden = false; };
  img.onerror = ()=>{
    if(roomImageURL!==url) return;
    roomImageCache.delete(key);
    clearRoomImage();
  };
  img.src = roomImageURL;
}
function renderRoomImage(s){
  const r = s.room || {};
  const context = {session_id:s.session_id==null?null:s.session_id, room_id:r.id};
  if(context.session_id!==roomImageSession){
    roomImageSession = context.session_id;
    roomImageVisits.clear();
    roomImageCache.clear();
  }
  const key = r.id==null ? null : JSON.stringify(context);
  if(key===roomImageKey) return;
  clearRoomImage();
  roomImageKey = key;
  if(roomImageCache.has(key)){ showRoomImage(roomImageCache.get(key), r); return; }
  if(key===null || roomImageVisits.has(key)) return;
  roomImageVisits.add(key);
  const controller = new AbortController();
  roomImageRequest = controller;
  const timeout = setTimeout(()=>controller.abort(), 90000);
  roomImageTimeout = timeout;
  // Image generation is optional and deliberately independent of command/poll busy state.
  // Like commands/state, the server selects the game actor and its current room.
  // Never send a client-authored scene or any provider credentials.
  fetch('/api/room-image', {
    method:'POST', credentials:'same-origin', signal:controller.signal
  }).then(async response=>{
    const responseRoom = response.headers.get('X-Room-Id');
    if(!response.ok || response.status===204 || controller.signal.aborted || key!==roomImageKey ||
       (responseRoom!==null && responseRoom!==String(r.id))){
      if(response.body) await response.body.cancel();
      return;
    }
    const blob = await response.blob();
    if(controller.signal.aborted || key!==roomImageKey || !blob.size || !blob.type.startsWith('image/')) return;
    roomImageCache.set(key, blob);
    if(roomImageCache.size>8) roomImageCache.delete(roomImageCache.keys().next().value);
    showRoomImage(blob, r);
  }).catch(()=>{}).finally(()=>{
    clearTimeout(timeout);
    if(roomImageRequest===controller){ roomImageRequest = null; roomImageTimeout = null; }
  });
}

function addLine(e){
  const d = document.createElement('div');
  if(e.level==='panel'){ d.className='panel-'+(e.kind||'x'); d.textContent=(e.title?('['+e.title+'] '):'')+e.text; }
  else { d.className='line '+(e.level||'say'); d.textContent=e.text; }
  $('#log').appendChild(d); $('#log').scrollTop=$('#log').scrollHeight;
}
function setBusy(b){
  busy = b;
  document.body.classList.toggle('busy', b);
  $('#send').disabled = b;
}
function esc(t){ const d=document.createElement('span'); d.textContent=(t==null?'':String(t)); return d.innerHTML; }
function bar(label, cls, cur, max){
  const pct = (max>0) ? Math.max(0, Math.min(100, Math.round(cur/max*100))) : 0;
  return '<div class="barrow"><label>'+label+'</label><div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div><b>'+cur+'/'+max+'</b></div>';
}
function renderHud(s){
  const el = $('#hudbody'); if(!el) return;
  const p = s.player || {};
  let h = '<div class="bars">';
  h += bar('Health','hp', p.hp||0, p.max_hp||0);
  h += bar('Fullness','sat', p.satiety||0, p.max_satiety||0);
  h += bar('Insight','ins', (s.insight==null?0:s.insight), (s.insight_max==null?0:s.insight_max));
  h += '</div>';
  const st = p.stats || {};
  h += '<div class="statline">';
  ['STR','DEX','CON','INT','WIS','CHA'].forEach(k=>{ if(st[k]!=null) h+='<span>'+k+' <b>'+st[k]+'</b></span>'; });
  h += '</div>';
  h += '<div class="statline"><span>AC <b>'+(p.ac==null?'?':p.ac)+'</b></span><span>Gold <b>'+(p.gold==null?'?':p.gold)+'</b></span><span>Virtue <b>'+(p.virtue==null?'?':p.virtue)+'</b></span><span>'+(p.floor||'')+'</span></div>';
  const eq = p.equipped || {};
  h += '<div class="equipped">';
  [['weapon','Weapon'],['armor','Armor'],['shield','Shield']].forEach(pair=>{
    h += '<div>'+pair[1]+': '+(eq[pair[0]] ? '<i>'+esc(eq[pair[0]])+'</i>' : '<span style="opacity:.5">empty</span>')+'</div>';
  });
  h += '</div>';
  const fx = p.status_effects || [];
  if(fx.length){ h += '<div class="effects">'; fx.forEach(f=>{ h+='<span class="effect">'+esc(typeof f==='string'?f:(f.name||JSON.stringify(f)))+'</span>'; }); h += '</div>'; }
  if(s.quest){
    const q = s.quest;
    h += '<div class="questline"><b>Quest:</b> '+esc(q.title||'')+' <b>('+(q.progress||0)+'/'+(q.needed||1)+')</b>';
    h += '<small>'+esc(q.objective||'')+' \u2014 '+esc(q.turn_in||'')+(q.gold?(' \u00b7 '+q.gold+'g'):'')+'</small></div>';
  } else if(s.quest_pending){
    h += '<div class="questline"><b>Offer:</b> '+esc(s.quest_pending.title||'')+' <small>from '+esc(s.quest_pending.giver||'')+' \u2014 ask about it in conversation</small></div>';
  }
  el.innerHTML = h;
}
function renderInv(s){
  const el = $('#invbody'); if(!el) return;
  const p = s.player || {};
  const inv = p.inventory || [];
  const wornNames = {}; Object.keys(p.equipped||{}).forEach(k=>{ const v=p.equipped[k]; if(v) wornNames[v]=true; });
  let h = '<div class="invhead">'+(p.inv_usage||0)+'/'+(p.inv_cap||0)+' slots</div>';
  if(!inv.length){ h += '<div class="invempty">Your pack is empty.</div>'; }
  inv.forEach(it=>{
    const nm = it.name;
    h += '<div class="invrow"><span class="nm" title="'+esc(nm)+'">'+esc(nm)+'</span>';
    if(wornNames[nm]) h += '<span class="worn">worn</span>';
    if(it.qty>1) h += '<span class="qty">\u00d7'+it.qty+'</span>';
    h += '<button class="iact" data-act="use" data-item="'+esc(nm)+'">Use</button>';
    if(wornNames[nm]) h += '<button class="iact" data-act="unequip" data-item="'+esc(nm)+'">Unequip</button>';
    else h += '<button class="iact" data-act="equip" data-item="'+esc(nm)+'">Equip</button>';
    h += '<button class="iact" data-act="drop" data-item="'+esc(nm)+'">Drop</button></div>';
  });
  el.innerHTML = h;
}
function renderSnapshot(s){
  if(!s) return;
  const r = s.room || {};
  let h = '<strong>'+esc(r.name)+'</strong><br>'+ esc(r.description||'');
  if(r.visual_elements && r.visual_elements!=='none') h += '<br><span style="color:var(--dim)">Details: '+esc(r.visual_elements)+'</span>';
  if(r.npc_presence) h += '<br>'+esc(r.npc_presence);
  if(r.contents) h += '<br><span style="color:var(--dim)">Contents: '+esc(r.contents)+'</span>';
  // compass: one cell per direction, active button only where an exit exists
  const byDir = {};
  (r.exits||[]).forEach(x=>{ byDir[x.dir]=x; });
  h += '<div class="compass" id="compass">';
  COMPASS.forEach(cell=>{
    if(cell===null){ h += '<span></span>'; return; }
    if(cell==='rose'){ h += '<span class="rose">&#10022;</span>'; return; }
    const x = byDir[cell];
    const letter = cell==='North'?'N':cell==='South'?'S':cell==='East'?'E':cell==='West'?'W':cell==='Up'?'U':'D';
    if(!x){ h += '<span class="ghost">'+letter+'</span>'; return; }
    const cls = 'exit'+(x.kind==='door'?' door':x.kind==='obstacle'?' obstacle':x.kind==='stairs'?' stairs':'');
    const note = x.state ? '<small>'+esc(x.state)+'</small>' : (x.name&&x.kind!=='exit' ? '<small>'+esc(x.name)+'</small>' : '');
    const title = esc(cell + (x.name?(' — '+x.name):'') + (x.state?(' ['+x.state+']'):''));
    h += '<button class="'+cls+'" data-cmd="'+DIR_CMD[cell]+'" title="'+title+'">'+letter+note+'</button>';
  });
  h += '</div>';
  const hs = r.hotspots||[];
  if(hs.length){ h += '<div class="hotspots">'; hs.forEach(x=>{ h+='<span class="hot">'+esc(x.type)+(x.name?(' '+esc(x.name)):x.monster?(' '+esc(x.monster)):'')+'</span>'; }); h += '</div>'; }
  $('#roombody').innerHTML = h;
  renderHud(s);
  renderInv(s);
  renderRoomImage(s);
}
async function poll(){
  let j;
  try {
    const r = await fetch('/api/events?cursor='+cursor); j = await r.json();
  } catch(err) { polling = setTimeout(poll, 700); return; }
  (j.events||[]).forEach(addLine); cursor = j.cursor;
  if(j.snapshot) renderSnapshot(j.snapshot);
  if(j.awaiting_prompt){ $('#promptbar').style.display='flex'; $('#promptlabel').textContent=(j.prompt||'answer').trim(); $('#ans').focus(); }
  else { $('#promptbar').style.display='none'; if(!busy) $('#cmd').focus(); }
  if(j.busy){ setBusy(true); polling = setTimeout(poll, 350); }
  else { setBusy(false); polling = null; refreshState(); }
}
async function refreshState(){
  // Belt and braces: once a command has finished, pull the authoritative
  // snapshot so the room/HUD panels can never lag behind the text log.
  try { const r = await fetch('/api/state'); const j = await r.json(); renderSnapshot(j.snapshot); }
  catch(err) {}
}
async function send(raw){
  const typed = (raw===undefined);
  let text = (typed ? $('#cmd').value : raw).trim(); if(!text) return;
  if(typed){
    $('#cmd').value='';
    if(hist[hist.length-1]!==text){ hist.push(text); }
    hidx = hist.length;
  }
  let r;
  try {
    r = await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  } catch(err) { addLine({level:'warn',text:'(could not reach the server - try again)'}); return; }
  if(r.status===409){ addLine({level:'warn',text:'(busy — wait for the current command)'}); return; }
  setBusy(true);
  if(!polling) poll();
}
async function answer(){
  const t=$('#ans').value; $('#ans').value='';
  try { await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})}); }
  catch(err) { addLine({level:'warn',text:'(answer failed - try again)'}); }
}
// Compass buttons are re-rendered with every snapshot, so delegate from
// document — #compass does not exist yet at script-parse time.
document.addEventListener('click', e=>{
  const b = e.target.closest && e.target.closest('button[data-cmd]'); if(!b) return;
  send(b.dataset.cmd);
});
// 2b: inventory action buttons -> engine commands (drop confirms; others fire)
document.addEventListener('click', e=>{
  const b = e.target.closest && e.target.closest('button.iact[data-act]'); if(!b) return;
  const act = b.dataset.act, item = b.dataset.item;
  if(act==='drop' && window.confirm && !window.confirm('Drop ' + item + ' for good?')) return;
  send(act + ' ' + item);
});
window.addEventListener('focus',()=>{ if(!polling) refreshState(); });
window.addEventListener('pagehide',()=>{ clearRoomImage(); roomImageKey = null; });
window.addEventListener('pageshow',e=>{ if(e.persisted) refreshState(); });
$('#send').onclick=()=>send();
$('#cmd').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ send(); return; }
  if(e.key==='ArrowUp'){ if(hidx>0){ hidx--; $('#cmd').value=hist[hidx]||''; e.preventDefault(); } }
  else if(e.key==='ArrowDown'){ if(hidx<hist.length-1){ hidx++; $('#cmd').value=hist[hidx]; } else { hidx=hist.length; $('#cmd').value=''; } e.preventDefault(); }
});
$('#ansbtn').onclick=answer;
$('#ans').addEventListener('keydown',e=>{if(e.key==='Enter')answer();});
(async()=>{
  try { const r=await fetch('/api/state'); const j=await r.json(); renderSnapshot(j.snapshot); } catch(err) {}
  addLine({level:'say',text:'Welcome to Luminaria. Type look to begin.'});
  await send('look');
  $('#cmd').focus();
})();
</script>
</body>
</html>
